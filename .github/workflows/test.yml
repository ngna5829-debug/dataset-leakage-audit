name: Offline package checks
'on':
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install the actual package and declared dependencies
        run: python -m pip install .
      - name: Check installed dependency consistency
        run: python -m pip check
      - name: Check installed CLI outside the checkout
        working-directory: ${{ runner.temp }}
        run: leakage-audit --help
      - name: Run offline Python tests
        run: python -m unittest discover -s tests -v
      - name: Exercise audit and explicit construction-label import
        run: |
          leakage-audit demo --out runs/ci-demo
          leakage-audit import-reviews --audit runs/ci-demo --reviews runs/ci-demo/fixture_reviews.json --out runs/ci-reviewed
          leakage-audit propose-split --audit runs/ci-reviewed --out runs/ci-proposal
