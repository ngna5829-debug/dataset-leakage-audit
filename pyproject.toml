[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dataset-leakage-audit"
version = "2.0.0"
description = "Offline image, text, and ordered-frame leakage candidate auditing"
requires-python = ">=3.11"
dependencies = ["Pillow==12.3.0", "numpy==2.3.5", "opencv-python-headless==4.13.0.92"]
license = "MIT"

[project.scripts]
leakage-audit = "leakage_audit:main"

[tool.setuptools]
py-modules = ["leakage_audit"]
